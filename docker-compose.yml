services:
  db:
    image: postgres:16
    container_name: eclassroompro-db
    environment:
      POSTGRES_DB: eClassroomPro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eClassroomPro"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: eclassroompro-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=eClassroomPro;Username=postgres;Password=postgres
      Jwt__Secret: ${JWT_SECRET:-DevelopmentOnlySecret_ReplaceMe_1234567890_1234567890_1234567890_ABCDEFGHIJKLMNOPQRSTUVWXYZ}
      Jwt__Issuer: eClassroomPro.API
      Jwt__Audience: eClassroomPro.Client
      Jwt__ExpiresMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
    ports:
      - "5000:8080"

volumes:
  pgdata:



  frontend:
    build: ./frontend
    container_name: eclassroompro-frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      # Mount your local code into the container for Hot Module Replacement (HMR)
      - ./frontend:/app
      # Prevent your local node_modules from overriding the container's node_modules
      - /app/node_modules
      # If using Next.js 13+, prevent the .next folder from being overwritten
      - /app/.next
    environment:
      # Tell Next.js how to reach your ASP.NET Core API
      # Use localhost because the browser makes this request, not the Docker container
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      # Use the internal Docker network for Server-Side Rendering (SSR) API calls
      - INTERNAL_API_URL=http://api:8080