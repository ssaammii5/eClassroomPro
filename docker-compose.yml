services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: eclassroompro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eClassroomPro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eClassroomPro"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- .NET API ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eclassroompro-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=eClassroomPro;Username=postgres;Password=postgres
      Jwt__Secret: ${JWT_SECRET:-DevelopmentOnlySecret_ReplaceMe_1234567890_1234567890_1234567890_ABCDEFGHIJKLMNOPQRSTUVWXYZ}
      Jwt__Issuer: ${JWT_ISSUER:-eClassroomPro.API}
      Jwt__Audience: ${JWT_AUDIENCE:-eClassroomPro.Client}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_DAYS:-7}
    ports:
      - "5000:8080"

  # ---------- Next.js Frontend (dev mode, hot reload) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eclassroompro-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      # Browser-side calls (the browser runs on your host machine)
      NEXT_PUBLIC_API_URL: http://localhost:5000
      # Server-side calls (inside the Docker network)
      INTERNAL_API_URL: http://api:8080
      # Enables file watching for hot reload on Docker Desktop (Windows/Mac)
      WATCHPACK_POLLING: "true"
    volumes:
      # Live-mount your source for hot module replacement
      - ./frontend:/app
      # Preserve the container's node_modules (don't shadow it with the host's)
      - frontend_node_modules:/app/node_modules
      # Isolate Next.js build cache
      - frontend_next:/app/.next

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next: